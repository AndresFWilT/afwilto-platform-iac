# AFWILTO platform — single-command startup for the shell, all MFEs,
# all backend managers and their databases.
#
#   docker compose up -d
#
# Spec: frontend/docs/specs/10-docker-compose-platform.md
# All cross-app URLs are browser-resolved, so every service the browser talks
# to publishes its allocated localhost port. Databases stay network-internal.

name: afwilto-platform

networks:
  afwilto:

volumes:
  theater_pgdata:
  nc_mysql_data:
  certifications_pgdata:
  certifications_uploads:
  studies_pgdata:
  studies_media:
  love_points_pgdata:
  # Reuses the volume created by the old standalone finance stack so existing
  # personal-finance data carries over into the platform.
  finance_pgdata:
    name: personal-financial-status_pgdata

services:
  # ── Frontend: Module Federation host ──────────────────────────────────────
  shell:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile.mfe
      args:
        APP: afwilto-shell-web-ui
        NGINX_CONF: nginx.host.conf
    ports:
      - "3000:80"
    restart: unless-stopped
    networks: [afwilto]

  # ── Frontend: remotes (each serves remoteEntry.js with CORS) ──────────────
  afwilto-home:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile.mfe
      args: { APP: afwilto-homepage-web-ui }
    ports:
      - "3001:80"
    restart: unless-stopped
    networks: [afwilto]

  slab-home:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile.mfe
      args: { APP: afwilto-slab-homepage-web-ui }
    ports:
      - "3002:80"
    restart: unless-stopped
    networks: [afwilto]

  ud:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile.mfe
      args: { APP: afwilto-slab-subject-ud-web-ui }
    ports:
      - "3003:80"
    restart: unless-stopped
    networks: [afwilto]

  mati:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile.mfe
      args: { APP: afwilto-slab-subject-mati-web-ui }
    ports:
      - "3004:80"
    restart: unless-stopped
    networks: [afwilto]

  finance-mfe:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile.mfe
      args: { APP: afwilto-financial-status-web-ui }
    ports:
      - "3005:80"
    restart: unless-stopped
    networks: [afwilto]

  certifications:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile.mfe
      args: { APP: afwilto-certifications-web-ui }
    ports:
      - "3006:80"
    restart: unless-stopped
    networks: [afwilto]

  love-points-bank:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile.mfe
      args: { APP: afwilto-love-points-bank-web-ui }
    ports:
      - "3007:80"
    restart: unless-stopped
    networks: [afwilto]

  studies:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile.mfe
      args: { APP: afwilto-studies-web-ui }
    ports:
      - "3008:80"
    restart: unless-stopped
    networks: [afwilto]

  cidr:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile.mfe
      args: { APP: afwilto-cidr-web-ui }
    ports:
      - "3009:80"
    restart: unless-stopped
    networks: [afwilto]

  # ── Backend: stateless subject managers ────────────────────────────────────
  cs-mngr:
    build: ./backend/afwilto-subject-computer-science-mngr
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks: [afwilto]

  physics-mngr:
    build: ./backend/afwilto-subject-physics-mngr
    ports:
      - "8087:8080"
    restart: unless-stopped
    networks: [afwilto]

  or-mngr:
    build: ./backend/afwilto-subject-operations-research-mngr
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8088:8080"
    restart: unless-stopped
    networks: [afwilto]

  os-mngr:
    build: ./backend/afwilto-subject-operative-system-mngr
    environment:
      RUST_LOG: info
    ports:
      - "8089:8080"
    restart: unless-stopped
    networks: [afwilto]

  ai-mngr:
    build: ./backend/afwilto-subject-artificial-intelligence-mngr
    environment:
      PYTHONPATH: /app/src
    ports:
      - "8090:8080"
    restart: unless-stopped
    networks: [afwilto]

  programming-mngr:
    build: ./backend/afwilto-subject-programming-mngr
    environment:
      QUARKUS_HTTP_PORT: "8080"
    ports:
      - "8091:8080"
    restart: unless-stopped
    networks: [afwilto]

  # ── Backend: slab CIDR calculator (Ruby + Sinatra, stateless) ─────────────
  # Spec: frontend/docs/specs/17-cidr-calculator.md
  cidr-mngr:
    build: ./backend/afwilto-slab-cidr-mngr
    environment:
      PORT: "8080"
      ALLOW_ORIGINS: http://localhost:3000,http://localhost:3009
      MAX_BODY_BYTES: "65536"
    ports:
      - "8092:8080"
    healthcheck:
      # The slim Ruby image has no curl; Ruby's stdlib does the probe.
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:8080/healthz')).is_a?(Net::HTTPSuccess) ? 0 : 1)"]
      interval: 10s
      retries: 6
    restart: unless-stopped
    networks: [afwilto]

  # ── Backend: theater (Databases II) — .NET + Postgres + MailHog ───────────
  theater-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: theater_management
      POSTGRES_USER: ${THEATER_DB_USER:-theater_admin}
      POSTGRES_PASSWORD: ${THEATER_DB_PASSWORD:-localdev123}
    volumes:
      - theater_pgdata:/var/lib/postgresql/data
      - ./backend/afwilto-subject-data-bases-mngr/scripts/seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${THEATER_DB_USER:-theater_admin}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [afwilto]

  theater-mngr:
    build: ./backend/afwilto-subject-data-bases-mngr
    environment:
      ConnectionStrings__DefaultConnection: "Host=theater-db;Port=5432;Database=theater_management;Username=${THEATER_DB_USER:-theater_admin};Password=${THEATER_DB_PASSWORD:-localdev123}"
      Jwt__Secret: ${JWT_SECRET:-dev-secret-change-in-production-minimum-32-chars}
      Jwt__ExpiryMinutes: 480
      Email__SmtpHost: mailhog
      Email__SmtpPort: 1025
      Email__Username: ""
      Email__Password: ""
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8085:8080"
    depends_on:
      theater-db:
        condition: service_healthy
    restart: unless-stopped
    networks: [afwilto]

  mailhog:
    image: mailhog/mailhog
    platform: linux/amd64
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped
    networks: [afwilto]

  # ── Backend: network-communication (Laravel + MySQL) ──────────────────────
  nc-db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${NC_DB_DATABASE:-network_comm}
      MYSQL_USER: ${NC_DB_USERNAME:-app}
      MYSQL_PASSWORD: ${NC_DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${NC_DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - nc_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      afwilto:
        # the Laravel image bakes DB_HOST=db in its .env; request workers read
        # that file, so the MySQL container must also answer to "db"
        aliases: [db]

  nc-mngr:
    build: ./backend/afwilto-subject-network-communication-mngr
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
    environment:
      DB_HOST: nc-db
      DB_PORT: 3306
      DB_DATABASE: ${NC_DB_DATABASE:-network_comm}
      DB_USERNAME: ${NC_DB_USERNAME:-app}
      DB_PASSWORD: ${NC_DB_PASSWORD:-secret}
    ports:
      - "8086:8000"
    depends_on:
      nc-db:
        condition: service_healthy
    restart: unless-stopped
    networks: [afwilto]

  # ── Backend: certifications journey (Go + Postgres) ───────────────────────
  # Spec: frontend/docs/specs/11-certifications-journey.md
  certifications-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: certifications
      POSTGRES_USER: ${CERT_DB_USER:-certifications}
      POSTGRES_PASSWORD: ${CERT_DB_PASSWORD:-certifications}
    volumes:
      - certifications_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CERT_DB_USER:-certifications} -d certifications"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [afwilto]

  certifications-mngr:
    build: ./backend/afwilto-certifications-mngr
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://${CERT_DB_USER:-certifications}:${CERT_DB_PASSWORD:-certifications}@certifications-db:5432/certifications?sslmode=disable
      STORAGE_DIR: /data/uploads
      MAX_UPLOAD_BYTES: "10485760"
      MIGRATE_ON_START: "true"
      ALLOW_ORIGINS: http://localhost:3000,http://localhost:3006
    ports:
      - "8082:8082"
    volumes:
      - certifications_uploads:/data/uploads
    depends_on:
      certifications-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 10s
      retries: 6
    restart: unless-stopped
    networks: [afwilto]

  # ── Backend: studies knowledge base (Go + Postgres) ───────────────────────
  # Spec: frontend/docs/specs/16-studies.md
  studies-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: studies
      POSTGRES_USER: ${STUDIES_DB_USER:-studies}
      POSTGRES_PASSWORD: ${STUDIES_DB_PASSWORD:-studies}
    volumes:
      - studies_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STUDIES_DB_USER:-studies} -d studies"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [afwilto]

  studies-mngr:
    build: ./backend/afwilto-studies-mngr
    environment:
      PORT: "8084"
      DATABASE_URL: postgres://${STUDIES_DB_USER:-studies}:${STUDIES_DB_PASSWORD:-studies}@studies-db:5432/studies?sslmode=disable
      MAX_BODY_BYTES: "1048576"
      MIGRATE_ON_START: "true"
      MEDIA_DIR: /data/media
      ALLOW_ORIGINS: http://localhost:3000,http://localhost:3008
    ports:
      - "8084:8084"
    volumes:
      # Exam question images, content-addressed (spec 18 slice 05).
      - studies_media:/data/media
    depends_on:
      studies-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 10s
      retries: 6
    restart: unless-stopped
    networks: [afwilto]

  # ── Backend: finance (Go + Postgres) ───────────────────────────────────────
  finance-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${FIN_DB_NAME:-findb}
      POSTGRES_USER: ${FIN_DB_USER:-finuser}
      POSTGRES_PASSWORD: ${FIN_DB_PASSWORD:-finpass}
    volumes:
      - finance_pgdata:/var/lib/postgresql/data
      - ../personal-financial-status/afwt-financial-status-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ../personal-financial-status/afwt-financial-status-db/migrations:/migrations:ro
      - ../personal-financial-status/afwt-financial-status-db/seeds:/seeds:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FIN_DB_USER:-finuser} -d ${FIN_DB_NAME:-findb}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [afwilto]

  finance-api:
    build: ../personal-financial-status/afwt-financial-status-backend
    environment:
      PORT: "8080"
      DB_HOST: finance-db
      DB_PORT: "5432"
      DB_NAME: ${FIN_DB_NAME:-findb}
      DB_USER: ${FIN_DB_USER:-finuser}
      DB_PASSWORD: ${FIN_DB_PASSWORD:-finpass}
      DB_SSL_MODE: disable
      DEFAULT_USER_ID: ${FIN_DEFAULT_USER_ID:-ce7982df-2de4-41a9-a80e-af787ce8cfd3}
      ALLOW_ORIGINS: "http://localhost:3000,http://localhost:3005"
    ports:
      - "8080:8080"
    depends_on:
      finance-db:
        condition: service_healthy
    restart: unless-stopped
    networks: [afwilto]

  # ── Backend: love points bank (Go + Postgres) ──────────────────────────────
  # Spec: frontend/docs/specs/15-love-points-bank-mfe.md
  # Service + migrations: backend/afwilto-love-points-bank-mngr (own repo).
  love-points-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${LOVE_POINTS_DB_NAME:-puntitos}
      POSTGRES_USER: ${LOVE_POINTS_DB_USER:-puntitos}
      POSTGRES_PASSWORD: ${LOVE_POINTS_DB_PASSWORD:-puntitos}
    volumes:
      - love_points_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOVE_POINTS_DB_USER:-puntitos} -d ${LOVE_POINTS_DB_NAME:-puntitos}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [afwilto]

  # One-shot: applies migrations and exits (not a live service).
  love-points-migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./backend/afwilto-love-points-bank-mngr/migrations:/migrations:ro
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://${LOVE_POINTS_DB_USER:-puntitos}:${LOVE_POINTS_DB_PASSWORD:-puntitos}@love-points-db:5432/${LOVE_POINTS_DB_NAME:-puntitos}?sslmode=disable"
      - "up"
    depends_on:
      love-points-db:
        condition: service_healthy
    restart: "no"
    networks: [afwilto]

  love-points-mngr:
    build: ./backend/afwilto-love-points-bank-mngr
    environment:
      DATABASE_URL: postgres://${LOVE_POINTS_DB_USER:-puntitos}:${LOVE_POINTS_DB_PASSWORD:-puntitos}@love-points-db:5432/${LOVE_POINTS_DB_NAME:-puntitos}?sslmode=disable
      HTTP_ADDR: ":8080"
      CORS_ORIGIN: "http://localhost:3000,http://localhost:3007"
    ports:
      - "8083:8080"
    depends_on:
      love-points-db:
        condition: service_healthy
      love-points-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [afwilto]
